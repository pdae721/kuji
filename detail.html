<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KUJI POP - 상품 상세</title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/css/detail.css"
  >

</head>

<body>


<header class="site-header">

  <div class="header-inner">

    <a href="/" class="logo">
      KUJI <span>POP</span>
    </a>

    <nav class="main-nav">
      <a href="/">홈</a>
      <a href="/#saleSection">판매중</a>
      <a href="/#howSection">이용방법</a>
    </nav>

  </div>

</header>


<main class="detail-page">

  <button
    type="button"
    class="back-button"
    id="detailBack"
  >
    ← 목록으로
  </button>


  <section class="detail-top">

    <div
      class="detail-image-area"
      id="detailImageArea"
    >

      <span class="sale-badge">
        판매중
      </span>

      <div
        class="main-prize-image"
        id="mainPrizeImage"
      >
        🎁
      </div>

    </div>


    <div class="detail-info">

      <span class="detail-category">
        CHARACTER KUJI
      </span>

      <h1 id="kujiTitle">
        상품 정보를 불러오는 중...
      </h1>

      <p class="detail-description">
        현재 남아 있는 경품 재고 중에서
        실제 티켓을 무작위로 추첨합니다.
      </p>


      <div class="detail-price-row">

        <span>
          1회 가격
        </span>

        <strong id="pricePerDraw">
          -
        </strong>

      </div>


      <div class="detail-stock">

        <div class="stock-text">

          <div>
            <span>
              남은 수량
            </span>

            <strong id="remainingCount">
              -
            </strong>
          </div>

          <span id="totalStockText">
            / -
          </span>

        </div>


        <div class="stock-bar">

          <div
            class="stock-fill"
            id="detailStockValue"
          >
          </div>

        </div>

      </div>

    </div>

  </section>


  <section class="prize-section">

    <div class="section-heading">

      <div>
        <span class="section-eyebrow">
          PRIZE LIST
        </span>

        <h2>
          경품 목록
        </h2>
      </div>

    </div>


    <div
      class="prize-list"
      id="prizeList"
    >
      <!-- detail.js -->
    </div>

  </section>


  <section class="draw-option-section">

    <h2>
      몇 번 뽑을까요?
    </h2>


    <div
      class="draw-count"
      id="drawCount"
    >

      <button
        class="count-button active"
        data-count="1"
      >
        1회
      </button>

      <button
        class="count-button"
        data-count="3"
      >
        3회
      </button>

      <button
        class="count-button"
        data-count="5"
      >
        5회
      </button>

      <button
        class="count-button"
        data-count="10"
      >
        10회
      </button>

    </div>


    <div class="payment-row">

      <span>
        결제 예정 금액
      </span>

      <strong id="totalPrice">
        -
      </strong>

    </div>


    <button
      type="button"
      class="detail-draw-button"
      id="detailDrawButton"
    >
      뽑기
    </button>

  </section>

</main>


<script
  type="module"
  src="/js/detail.js">
</script>

</body>
</html>
